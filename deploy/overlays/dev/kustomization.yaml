apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: dev-
namespace: dev

commonLabels:
  env: dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: python-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "development"
  - target:
      kind: Service
      name: python-service
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30082
