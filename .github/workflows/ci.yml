name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'deploy/**'
  pull_request:
    branches: [ master, main ]

# 授予工作流写入代码仓库 (用于回写部署清单) 与发布镜像的权限
permissions:
  contents: write
  packages: write

jobs:
  # ==========================================
  # 阶段 1：自动化单元测试与质量门禁
  # ==========================================
  test:
    name: 1. Run Unit Tests & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12 运行时
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装项目测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 执行自动化测试
        run: |
          pytest -v

  # ==========================================
  # 阶段 2：现代容器镜像构建并推送到 GHCR
  # ==========================================
  build-and-push:
    name: 2. Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test # 关键门禁：只有测试成功后才执行构建

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Docker BuildKit 引擎
        uses: docker/setup-buildx-action@v3

      - name: 提取镜像元数据 (Tag 标签与描述)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: 免密登录 GHCR (使用 GitHub Actions 自动签发的安全令牌)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 使用 BuildKit 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub Actions 云端层缓存，二次构建极速秒级完成
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 阶段 3：GitOps 清单自动回写 (触发 Argo CD 部署)
  # ==========================================
  update-manifest:
    name: 3. Update GitOps Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: 检出代码 (包含完整 Git 历史)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 自动更新 deploy/deployment.yaml 镜像版本
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "Updating deployment manifest to image tag: ${IMAGE_TAG}"
          
          python3 -c "
          import re
          with open('deploy/deployment.yaml', 'r') as f:
              content = f.read()
          content = re.sub(r'image:\s*ghcr\.io/[^:]+:.*', f'image: ghcr.io/${{ github.repository }}:${IMAGE_TAG}', content)
          content = re.sub(r'(- name: APP_VERSION\s*\n\s*value:)\s*[^\n]+', rf'\g<1> \"${IMAGE_TAG}\"', content)
          with open('deploy/deployment.yaml', 'w') as f:
              f.write(content)
          "
          
          echo "=== Diff in deployment.yaml ==="
          git diff deploy/deployment.yaml

      - name: 提交并推送到 GitHub (带 [skip ci] 防止递归触发)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet deploy/deployment.yaml; then
            echo "No changes in deployment.yaml, skip commit."
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            git add deploy/deployment.yaml
            git commit -m "chore(gitops): auto-update image to sha-${SHORT_SHA} [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
