apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-
namespace: prod

commonLabels:
  env: prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: python-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "production"
  - target:
      kind: Service
      name: python-service
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30083
