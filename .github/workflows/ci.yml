name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# 授予工作流写入 GHCR 镜像仓库的权限
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 阶段 1：自动化单元测试与质量门禁
  # ==========================================
  test:
    name: 1. Run Unit Tests & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12 运行时
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装项目测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 执行自动化测试
        run: |
          pytest -v

  # ==========================================
  # 阶段 2：现代容器镜像构建并推送到 GHCR
  # ==========================================
  build-and-push:
    name: 2. Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test # 关键门禁：只有测试成功后才执行构建

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Docker BuildKit 引擎
        uses: docker/setup-buildx-action@v3

      - name: 提取镜像元数据 (Tag 标签与描述)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: 免密登录 GHCR (使用 GitHub Actions 自动签发的安全令牌)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 使用 BuildKit 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub Actions 云端层缓存，二次构建极速秒级完成
          cache-from: type=gha
          cache-to: type=gha,mode=max
